<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>House 4A Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas, a drafting-table control sheet docked right (bottom sheet on phones) */
:root {
  --paper: #f6f5f1;
  --sheet: #ffffffee;
  --ink: #1d2733;
  --muted: #5d6b78;
  --rule: #d9dde0;
  --accent: #2c6e8f;
  --accent-ink: #ffffff;
  --chip: #eef3f6;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-dim: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11171d; --sheet: #182129ee; --ink: #e4eaee; --muted: #9aa8b3; --rule: #2c3842;
  --accent: #6fb3d4; --accent-ink: #0b1418; --chip: #22303a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11171d; --sheet: #182129ee; --ink: #e4eaee; --muted: #9aa8b3; --rule: #2c3842;
  --accent: #6fb3d4; --accent-ink: #0b1418; --chip: #22303a; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 292px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; background: var(--sheet); backdrop-filter: blur(10px);
  border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 6px 24px #0000001f;
}
.head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.dims { font-family: var(--font-dim); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
.dims b { color: var(--ink); font-weight: 500; }
section { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
button {
  font: inherit; font-size: 12.5px; padding: 7px 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--chip); color: var(--ink);
}
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.row output { font-family: var(--font-dim); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] { width: 40px; height: 26px; border: 1px solid var(--rule); border-radius: 5px; padding: 0; background: none; }
select { font: inherit; font-size: 12.5px; padding: 5px; border-radius: 6px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); }
.switch { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }
details { font-size: 12.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--rule); padding-top: 12px; }
details summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details ul { margin: 8px 0 0; padding-left: 18px; }
.hint { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; }
.tour-btn { width: 100%; padding: 9px; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#caption { position: fixed; left: max(5vw, env(safe-area-inset-left, 0px)); bottom: calc(7vh + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: .35em; opacity: 0; pointer-events: none; transition: opacity .1s linear;
  font-family: var(--font-ui); color: #fff; text-shadow: 0 1px 3px #0008;
  background: rgba(12, 16, 20, 0.62); padding: .75em 1.1em .85em; border-radius: 6px; backdrop-filter: blur(4px); }
#cap-main { font-size: clamp(20px, 3.1vw, 54px); font-weight: 600; letter-spacing: .01em; }
#cap-sub { font-family: var(--font-dim); font-size: clamp(13px, 1.55vw, 27px); color: #f3f6f8; }
#caption::before { content: ""; width: 3.2em; height: 3px; background: #ffc27a; font-size: clamp(20px, 3.1vw, 54px); }
#stop-tour { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
body.touring .panel, body.touring .hint { display: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-dim); color: var(--muted); }
@media (max-width: 700px) {
  .panel { top: auto; bottom: env(safe-area-inset-bottom, 0px); right: 0; left: 0; width: auto; max-height: 44%;
    border-radius: 12px 12px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
  .hint { display: none; }
}
</style>

<div id="stage"></div>
<div id="loading">Building the model…</div>

<aside class="panel" aria-label="Model controls">
  <div class="head">
    <h1 id="job-title">House model</h1>
    <p id="job-intro">Built from the architect's CAD floor plan. Drag to orbit, scroll or pinch to zoom.</p>
    <div class="dims" id="job-dims"></div>
  </div>

  <section>
    <span class="label">View</span>
    <div class="seg" id="views"></div>
    <button id="play-tour" class="tour-btn">Play house tour</button>
  </section>

  <section>
    <span class="label">Show</span>
    <div class="seg" id="levels">
      <button id="l-all" data-level="all" aria-pressed="true">Whole house</button>
      <button id="l-roof" data-level="noroof">Roof off</button>
      <button id="l-ground" data-level="ground">Ground only</button>
    </div>
  </section>

  <section>
    <span class="label">Light</span>
    <div class="row"><label for="time">Time of day</label><output id="time-out">10:30</output></div>
    <input type="range" id="time" min="6" max="22" step="0.25" value="10.5">
    <div class="row"><label for="facing">Front of house faces</label>
      <select id="facing">
        <option value="0">North</option><option value="90" selected>East</option>
        <option value="180">South</option><option value="270">West</option>
      </select>
    </div>
    <label class="switch"><input type="checkbox" id="lights"> Room lights on</label>
  </section>

  <section>
    <span class="label">Edit</span>
    <div class="row"><label for="height">Floor height</label><output id="height-out">10′</output></div>
    <input type="range" id="height" min="9" max="12" step="0.5" value="10">
    <div class="row"><label for="wallc">Wall colour</label><input type="color" id="wallc" value="#efe8dc"></div>
    <div class="row"><label for="floorc">Floor tint</label><input type="color" id="floorc" value="#f3eee6"></div>
    <label class="switch"><input type="checkbox" id="plan" checked> Plan drawing on floors</label>
  </section>

  <details>
    <summary>What was assumed</summary>
    <ul id="job-assume"></ul>
  </details>
</aside>
<div class="hint">Right-drag or two-finger drag to pan</div>
<div id="fade" aria-hidden="true"></div>
<div id="caption" aria-live="polite"><span id="cap-main"></span><span id="cap-sub"></span></div>
<button id="stop-tour" hidden>Stop tour</button>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const [data, job] = await Promise.all([fetch("house.json").then(r => r.json()), fetch("job.json").then(r => r.json())]);
{ // panel text from the job file
  const m = job.meta, esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  document.getElementById("job-title").textContent = m.title;
  if (m.intro) document.getElementById("job-intro").textContent = m.intro;
  document.getElementById("job-dims").innerHTML = (m.dims || []).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");
  document.getElementById("job-assume").innerHTML = (m.assumptions || []).map(t => `<li>${esc(t)}</li>`).join("");
  document.getElementById("views").innerHTML = job.views.map((v, i) =>
    `<button id="v-${esc(v.id)}" data-view="${esc(v.id)}" aria-pressed="${i === 0}">${esc(v.label)}</button>`).join("");
  if (m.facing_deg != null) document.getElementById("facing").value = String(m.facing_deg);
}

// ---------- editable parameters (feet) ----------
const P = { floorH: 10, slabT: 0.45, doorH: 7, sill: 3, head: 7, parapet: 3, railH: 3.5,
            wallColor: "#efe8dc", floorTint: "#f3eee6", ...(job.params || {}) };
document.getElementById("height").value = P.floorH; document.getElementById("height-out").textContent = `${P.floorH}′`;
document.getElementById("wallc").value = P.wallColor; document.getElementById("floorc").value = P.floorTint;
// stair + lift positions read from the plan (feet, plot coordinates)
const LIFT = job.layout.lift || null;          // lift box (outer walls)
const STAIR = job.layout.stair_u || null;      // U-shaped stair around the lift: see SKILL.md
const COURT = job.layout.court || null;        // roof opening over an open courtyard
const F1 = data.floors[1].bbox;           // first-floor outline [x0,z0,x1,z1]
const CENTER = new THREE.Vector3(...job.layout.center);

// ---------- renderer / scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfdde6, 180, 420);
const camera = new THREE.PerspectiveCamera(45, 1, 0.3, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.copy(CENTER);
camera.position.set(...job.views[0].p); controls.target.set(...job.views[0].t);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xdfeefa, 0x8a7f6c, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 260 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
sun.target.position.copy(CENTER);
scene.add(sun, sun.target);

// ---------- materials ----------
const manager = new THREE.LoadingManager();
const texReady = new Promise(res => { manager.onLoad = res; });
const tl = new THREE.TextureLoader(manager);
function planTex(key) {
  const t = tl.load(data.tex[key].src);
  t.colorSpace = THREE.SRGBColorSpace; t.flipY = false;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const [x0, z0, W, H] = data.tex[key].world;
  t.repeat.set(1 / W, -1 / H); t.offset.set(-x0 / W, -z0 / H);
  return t;
}
const texG = planTex("ground"), texF = planTex("first");
const M = {
  wall: new THREE.MeshStandardMaterial({ color: P.wallColor, roughness: 0.88 }),
  slab: new THREE.MeshStandardMaterial({ color: 0xe2ddd4, roughness: 0.9 }),
  floorG: new THREE.MeshStandardMaterial({ map: texG, color: P.floorTint, roughness: 0.92 }),
  floorF: new THREE.MeshStandardMaterial({ map: texF, color: P.floorTint, roughness: 0.92 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x8fb8cc, roughness: 0.08, metalness: 0.2, transparent: true, opacity: 0.38, depthWrite: false }),
  steel: new THREE.MeshStandardMaterial({ color: 0x8d969c, roughness: 0.35, metalness: 0.75 }),
  stair: new THREE.MeshStandardMaterial({ color: 0xbfb6a8, roughness: 0.6 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x9aa58a, roughness: 1 }),
  road: new THREE.MeshStandardMaterial({ color: 0x6d7072, roughness: 0.95 }),
};

// ground and street (street runs along the portico side, z < 0)
const earth = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), M.ground);
earth.rotation.x = -Math.PI / 2; earth.position.set(20, -0.02, 30); earth.receiveShadow = true;
scene.add(earth);
const road = new THREE.Mesh(new THREE.PlaneGeometry(600, 24), M.road);
road.rotation.x = -Math.PI / 2; road.position.set(20, -0.01, -16); road.receiveShadow = true;
scene.add(road);

// ---------- helpers ----------
const UNIT = new THREE.BoxGeometry(1, 1, 1);
function instanced(boxes, mat, shadows = true) {
  const mesh = new THREE.InstancedMesh(UNIT, mat, Math.max(boxes.length, 1));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
  boxes.forEach((b, i) => {
    const [x, z, w, d, y0, y1] = b;
    p.set(x + w / 2, (y0 + y1) / 2, z + d / 2); s.set(w, Math.max(y1 - y0, 0.01), d);
    mesh.setMatrixAt(i, m.compose(p, q, s));
  });
  mesh.count = boxes.length;
  mesh.castShadow = shadows; mesh.receiveShadow = true;
  return mesh;
}
// shape in plan coords (x, z); rotated so it lies flat, facing up
function flatShape(outer, holes = []) {
  const sh = new THREE.Shape(outer.map(([x, z]) => new THREE.Vector2(x, -z)));
  holes.forEach(h => sh.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z)))));
  return sh;
}
function slab(shape, topY, thick, floorMat) {
  const g = new THREE.Group();
  const eg = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false });
  eg.rotateX(-Math.PI / 2);
  const body = new THREE.Mesh(eg, M.slab);
  body.position.y = topY - thick; body.castShadow = body.receiveShadow = true;
  g.add(body);
  if (floorMat) {
    const sg = new THREE.ShapeGeometry(shape); sg.rotateX(-Math.PI / 2);
    const top = new THREE.Mesh(sg, floorMat);
    top.position.y = topY + 0.015; top.receiveShadow = true;
    g.add(top);
  }
  return g;
}
const rectPts = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
const overlap = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.z0 < b.z1 && b.z0 < a.z1;

// split a rect [x,z,w,d] against zone; returns {inside:[], outside:[]}
function splitRect(r, zn) {
  const [x, z, w, d] = r, a = { x0: x, z0: z, x1: x + w, z1: z + d };
  if (!overlap(a, zn)) return { inside: [], outside: [r] };
  const ix0 = Math.max(a.x0, zn.x0), ix1 = Math.min(a.x1, zn.x1), iz0 = Math.max(a.z0, zn.z0), iz1 = Math.min(a.z1, zn.z1);
  const out = [];
  if (a.z0 < iz0) out.push([a.x0, a.z0, w, iz0 - a.z0]);
  if (iz1 < a.z1) out.push([a.x0, iz1, w, a.z1 - iz1]);
  if (a.x0 < ix0) out.push([a.x0, iz0, ix0 - a.x0, iz1 - iz0]);
  if (ix1 < a.x1) out.push([ix1, iz0, a.x1 - ix1, iz1 - iz0]);
  return { inside: [[ix0, iz0, ix1 - ix0, iz1 - iz0]], outside: out };
}

// group short blue-line pieces into objects: lift door, glass partition, courtyard grill
function railGroups(rects) {
  const groups = [];
  rects.forEach(r => {
    const b = { x0: r[0] - 0.4, z0: r[1] - 0.4, x1: r[0] + r[2] + 0.4, z1: r[1] + r[3] + 0.4 };
    let g = groups.find(g => overlap(g.box, b));
    if (!g) { g = { box: { ...b }, rects: [] }; groups.push(g); }
    g.rects.push(r);
    g.box.x0 = Math.min(g.box.x0, b.x0); g.box.z0 = Math.min(g.box.z0, b.z0);
    g.box.x1 = Math.max(g.box.x1, b.x1); g.box.z1 = Math.max(g.box.z1, b.z1);
  });
  return groups.map(g => {
    const len = Math.max(g.box.x1 - g.box.x0, g.box.z1 - g.box.z0) - 0.8;
    return { ...g, len, kind: len >= 10 ? "grill" : len >= 4 ? "glass" : "liftdoor" };
  });
}

// ---------- build ----------
const groups = { g0: new THREE.Group(), g1: new THREE.Group(), g2: new THREE.Group() };
Object.values(groups).forEach(g => scene.add(g));
const roomLights = [], liftDoors = [];
// lift car: floor, ceiling and a light, moved by the tour; hidden otherwise
const SHAFT = job.layout.shaft || { x0: 0, z0: 0, x1: 1, z1: 1 };
const liftCar = new THREE.Group();
{
  const w = SHAFT.x1 - SHAFT.x0 - 0.1, d = SHAFT.z1 - SHAFT.z0 - 0.1;
  const fl = new THREE.Mesh(UNIT, new THREE.MeshStandardMaterial({ color: 0x6b6460, roughness: 0.5 }));
  fl.scale.set(w, 0.3, d); fl.position.y = -0.15;
  const ce = new THREE.Mesh(UNIT, new THREE.MeshStandardMaterial({ color: 0xd9dcde, roughness: 0.4, metalness: 0.5 }));
  ce.scale.set(w, 0.2, d); ce.position.y = 8.1;
  const back = new THREE.Mesh(UNIT, new THREE.MeshStandardMaterial({ color: 0xa9afb3, roughness: 0.25, metalness: 0.85 }));
  back.scale.set(0.12, 7.9, d); back.position.set(-w / 2 + 0.06, 4, 0);
  const lamp = new THREE.PointLight(0xfff0dc, 30, 14, 1.6); lamp.position.y = 7.6;
  liftCar.add(fl, ce, back, lamp);
  liftCar.position.set((SHAFT.x0 + SHAFT.x1) / 2, 0, (SHAFT.z0 + SHAFT.z1) / 2);
  liftCar.visible = false;
  scene.add(liftCar);
}

function build() {
  Object.values(groups).forEach(g => {
    g.traverse(o => { if (o.geometry && o.geometry !== UNIT) o.geometry.dispose(); });
    g.clear();
  });
  roomLights.length = 0; liftDoors.length = 0;
  const FH = P.floorH, R = FH / 18;

  data.floors.forEach((fl, i) => {
    const base = i * FH, top = base + FH;
    const grp = i === 0 ? groups.g0 : groups.g1;
    const wall = [], glass = [], steel = [], liftDoor = [];
    const lowZone = STAIR ? { x0: STAIR.x0 - 0.1, x1: STAIR.x1, z0: STAIR.zb - 0.7, z1: STAIR.z1 + 0.05 } : null;
    const lowTop = 12 * R - 0.55;
    fl.solid.forEach(r => {
      if (i === 0 && lowZone) {
        const c = { x0: r[0] + r[2] / 2, z0: r[1] + r[3] / 2 };
        const inLift = LIFT && c.x0 > LIFT.x0 && c.x0 < LIFT.x1 && c.z0 > LIFT.z0 && c.z0 < LIFT.z1;
        if (!inLift) {
          const { inside, outside } = splitRect(r, lowZone);
          inside.forEach(q => wall.push([...q, base, lowTop]));      // walls tucked under the stair landing
          outside.forEach(q => wall.push([...q, base, top]));
          return;
        }
      }
      wall.push([...r, base, top]);
    });
    fl.window.forEach(r => {
      wall.push([...r, base, base + P.sill], [...r, base + P.head, top]);
      glass.push([...r, base + P.sill, base + P.head]);
    });
    fl.door.forEach(r => wall.push([...r, base + P.doorH, top]));
    railGroups(fl.rail).forEach(g => {
      g.rects.forEach(r => {
        if (g.kind === "grill") {
          glass.push([...r, base, base + P.railH]);
        } else {
          wall.push([...r, base + P.head, top]);
          (g.kind === "glass" ? glass : liftDoor).push([...r, base, base + P.head]);
        }
      });
      if (g.kind === "grill") {
        const b = g.box, horiz = b.x1 - b.x0 > b.z1 - b.z0, cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
        steel.push(horiz ? [b.x0 + .4, cz - .12, b.x1 - b.x0 - .8, .24, base + P.railH, base + P.railH + .15]
                         : [cx - .12, b.z0 + .4, .24, b.z1 - b.z0 - .8, base + P.railH, base + P.railH + .15]);
        const n = Math.floor((horiz ? b.x1 - b.x0 : b.z1 - b.z0) / 0.5);
        for (let k = 1; k < n - 1; k++) {
          const t = (horiz ? b.x0 : b.z0) + k * 0.5;

  if (STAIR) {
  const run1 = (STAIR.x1 - STAIR.xm) / 5, run2 = (STAIR.zb - STAIR.za) / 5, run3 = (STAIR.x1 - STAIR.xm) / 5;
  for (let k = 0; k < 5; k++)                     // flight 1: along the front, rising towards the left wall

}

// ---------- facade: cladding, frames, LED strips, lights (job.facade) ----------
function canvasTex(draw, size = 256) {

}

function facadeMats() {

      for (let k = 0; k < 6; k++) { g.fillStyle = `rgba(60,30,15,${0.08 + rnd() * 0.12})`; g.fillRect(i * w + rnd() * w, 0, 1 + rnd() * 2, s); }

    }

    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (let i = 0; i < n; i++) {
      const v = rnd() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${rnd() * alpha})`;
      const r = 1 + rnd() * 5; g.fillRect(rnd() * s, rnd() * s, r, r * (0.5 + rnd()));
    }

    g.fillStyle = "#8f8676"; g.fillRect(0, 0, s, s);

        for (let k = 0; k < 18; k++) { g.fillStyle = `rgba(90,80,65,${rnd() * 0.18})`; g.fillRect(x + rnd() * w, y + rnd() * h, 3, 2); }

    wooddark: std({ map: wood, color: 0x8a6a58, roughness: 0.6 }),
    stone: std({ map: speckle("#a7a6a2", 900, 0.22), roughness: 0.9 }), stoneTile: 4,
    beige: std({ map: ashlar, roughness: 0.92 }), beigeTile: 4,
    darkstone: std({ map: speckle("#4c4a47", 700, 0.25), roughness: 0.9 }), darkstoneTile: 3,
    charcoal: std({ color: 0x3d4146, roughness: 0.55 }),

}
function uvBox(w, h, d, tile) {                // box whose texture repeats every `tile` feet on every face

function addFacade(FH, fc) {
  const FM = facadeMats();

// ---------- furniture (positions read from the plan drawing, feet) ----------
const WOOD = "#8a5a3c", WOOD_D = "#5a3a28", WHITE = "#f7f6f2";

const matCache = {};
function mat(c, o = {}) {

const strip = (r, s, t) => s === "n" ? { ...r, z1: r.z0 + t } : s === "s" ? { ...r, z0: r.z1 - t } : s === "w" ? { ...r, x1: r.x0 + t } : { ...r, x0: r.x1 - t };

const ENDS = s => (s === "n" || s === "s") ? ["w", "e"] : ["n", "s"];

function addFurniture(g, y, list) {
  const B = (r, y0, y1, c, o) => {

    switch (type) {
      case "rug": B(r, 0.01, 0.05, p1, { r: 1 }); break;
      case "sofa": {
        B(r, 0, 1.4, p2); B(strip(r, p1, 0.75), 0, 2.8, p2);
        ENDS(p1).forEach(e => B(strip(r, e, 0.5), 0, 2.1, p2));
        break;
      }
      case "table": B(r, p1 - 0.15, p1, WOOD, { r: 0.5 }); B(inset(r, Math.min(r.x1 - r.x0, r.z1 - r.z0) * 0.3), 0, p1 - 0.15, WOOD_D); break;
      case "chair": B(r, 1.35, 1.55, WOOD); B(inset(r, 0.3), 0, 1.35, WOOD_D); B(strip(r, p1, 0.18), 1.55, 3.1, WOOD); break;
      case "tv": {
        B(r, 0, 1.6, WOOD_D, { r: 0.5 });
        const sc = strip(r, p1, 0.12), e = ENDS(p1), w = along(r, e[0]) * 0.17;
        B(trim(trim(sc, e[0], w), e[1], w), 3.0, 5.6, "#111418", { r: 0.25, m: 0.4 });
        break;
      }
      case "cabinet": B(r, 0, p1, WOOD); break;
      case "side": B(r, 0, 1.9, WOOD); B(inset(r, 0.45), 1.9, 3.0, "#f1e2c4", { r: 0.6 }); break;
      case "counter": B(r, 0, 2.75, "#d9d2c5"); B(r, 2.75, 2.9, "#34363a", { r: 0.3 }); break;
      case "sink": B(r, 2.9, 2.95, "#a9b1b6", { m: 0.8, r: 0.25 }); break;
      case "stove": B(r, 2.9, 3.0, "#1b1b1d", { r: 0.4 }); break;

function addRoomLight(grp, x, y, z, area) {
  const L = new THREE.PointLight(0xffcf94, 0, Math.sqrt(area) * 2.6 + 10, 1.6);

// ---------- sun & time ----------
const sky = new THREE.Color(), dayC = new THREE.Color(0xcfdde6), duskC = new THREE.Color(0xe7b48e), nightC = new THREE.Color(0x0f1824);
function applyLight() {
  const h = +document.getElementById("time").value;
  const facing = +document.getElementById("facing").value * Math.PI / 180;
  const day = Math.max(0, Math.sin(Math.PI * (h - 6) / 12.5));            // 0 at 6:00 and ~18:30
  const elev = day * 1.3;                                                   // radians, up to ~75 degrees
  const az = Math.PI * (h - 6) / 12;                                        // east -> west
  // plan front (-z) points to the chosen compass direction
  const north = new THREE.Vector3(-Math.sin(facing), 0, -Math.cos(facing));
  const east = new THREE.Vector3(-north.z, 0, north.x);
  const south = north.clone().negate();
  const horiz = east.clone().multiplyScalar(Math.cos(az)).add(south.clone().multiplyScalar(Math.sin(az) * 0.35)).normalize();
  const dir = horiz.multiplyScalar(Math.cos(elev)).add(new THREE.Vector3(0, Math.sin(Math.max(elev, 0.05)), 0));
  sun.position.copy(CENTER).addScaledVector(dir.normalize(), 120);
  sun.intensity = 2.8 * Math.min(1, day * 2.2);
  const warm = 1 - Math.min(1, day * 2.5);
  sun.color.setRGB(1, 0.95 - warm * 0.25, 0.88 - warm * 0.4);
  const night = h >= 18.5 ? Math.min(1, (h - 18.5) / 1.5) : h < 6.5 ? 1 - (h - 6) / 0.5 : 0;
  sky.copy(dayC).lerp(duskC, warm * (1 - night) * 0.7).lerp(nightC, night);
  scene.background = sky; scene.fog.color.copy(sky);
  hemi.intensity = 1.15 * (1 - night * 0.85);
  const on = document.getElementById("lights").checked;
  roomLights.forEach(L => L.intensity = on ? L.userData.power : 0);
  if (FACADE_MAT.led) FACADE_MAT.led.emissiveIntensity = on ? 2.2 + night * 1.5 : 0.25;
  M.glass.emissive.set(on ? 0xffb366 : 0x000000);
  M.glass.emissiveIntensity = on ? 0.15 + night * 0.6 : 0;
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  document.getElementById("time-out").textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

const VIEWS = Object.fromEntries(job.views.map(v => [v.id, v]));
let anim = null;
function goView(name) {
  const v = VIEWS[name];
  if (v.roofOff && level === "all") pressLevel("noroof");
  anim = { t0: performance.now(), p0: camera.position.clone(), q0: controls.target.clone(),
           p1: new THREE.Vector3(...v.p), q1: new THREE.Vector3(...v.t) };
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === name));
}
function pressLevel(l, rebuild = true) {
  setLevel(l);
  document.querySelectorAll("#levels button").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === l));
}

// ---------- UI ----------
document.getElementById("views").addEventListener("click", e => { const b = e.target.closest("button"); if (b) goView(b.dataset.view); });
document.getElementById("levels").addEventListener("click", e => { const b = e.target.closest("button"); if (b) pressLevel(b.dataset.level); });
["time", "facing", "lights"].forEach(id => document.getElementById(id).addEventListener("input", applyLight));
document.getElementById("height").addEventListener("input", e => {
  P.floorH = +e.target.value; document.getElementById("height-out").textContent = `${P.floorH}′`; build();
});
document.getElementById("wallc").addEventListener("input", e => M.wall.color.set(e.target.value));
document.getElementById("floorc").addEventListener("input", e => { M.floorG.color.set(e.target.value); M.floorF.color.set(e.target.value); });
document.getElementById("plan").addEventListener("change", e => {
  M.floorG.map = e.target.checked ? texG : null; M.floorF.map = e.target.checked ? texF : null;
  M.floorG.needsUpdate = M.floorF.needsUpdate = true;
});

build();
document.getElementById("loading").remove();

// ---------- house tour ----------
// Each shot: duration, camera keys [t, position, target], light settings, captions [from, to, title, detail].
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SHOTS = job.tour.map(s => ({ ...s, keys: s.keys.map(([t, p, q]) => [t, V(...p), V(...q)]) }));
let off = 0; SHOTS.forEach(s => { s.t0 = off; off += s.d; });
const TOUR_LEN = off;
SHOTS.forEach(s => {
  s.pc = new THREE.CatmullRomCurve3(s.keys.map(k => k[1]), false, "centripetal");
  s.qc = new THREE.CatmullRomCurve3(s.keys.map(k => k[2]), false, "centripetal");
});
// time inside shot -> curve parameter: monotone cubic through the keys, still at both ends
SHOTS.forEach(s => {
  const xs = s.keys.map(k => k[0]), n = xs.length - 1, ys = xs.map((_, i) => i / n);
  const dk = xs.slice(0, n).map((x, i) => (ys[i + 1] - ys[i]) / (xs[i + 1] - x));
  const m = xs.map((_, i) => i === 0 || i === n ? 0 : (dk[i - 1] * dk[i] <= 0 ? 0 : 2 / (1 / dk[i - 1] + 1 / dk[i])));
  s.map = { xs, ys, m };
});
function keyParam(s, t) {
  const { xs, ys, m } = s.map;
  for (let i = 0; i < xs.length - 1; i++) if (t <= xs[i + 1]) {
    const h = xs[i + 1] - xs[i], f = (t - xs[i]) / h, f2 = f * f, f3 = f2 * f;
    return (2 * f3 - 3 * f2 + 1) * ys[i] + (f3 - 2 * f2 + f) * h * m[i] + (-2 * f3 + 3 * f2) * ys[i + 1] + (f3 - f2) * h * m[i + 1];
  }
  return 1;
}
const capEl = document.getElementById("caption"), capMain = document.getElementById("cap-main"),
      capSub = document.getElementById("cap-sub"), fadeEl = document.getElementById("fade");
let lastShot = null;
function renderAt(T) {
  T = Math.min(Math.max(T, 0), TOUR_LEN - 1e-4);
  const s = SHOTS.find(s => T < s.t0 + s.d) || SHOTS[SHOTS.length - 1];
  const t = T - s.t0;
  if (s !== lastShot) {
    setLevel(s.level);
    document.getElementById("lights").checked = s.lights;
    lastShot = s;
  }
  const h = s.hourEnd ? s.hour + (s.hourEnd - s.hour) * (t / s.d) : s.hour;
  document.getElementById("time").value = h; applyLight();
  const u = keyParam(s, t);
  camera.position.copy(s.pc.getPoint(u)); camera.lookAt(s.qc.getPoint(u)); controls.target.copy(s.qc.getPoint(u));
  liftCar.visible = !!s.lift;
  liftDoors.forEach(m => m.visible = !s.lift);                     // doors stand open during the lift scenes
  if (s.lift === "ride") liftCar.position.y = camera.position.y - 5.3;
  else if (s.lift) liftCar.position.y = 0.02;
  // fades: black in at the start, dip between shots, out at the end
  const fi = 0.45, fade = Math.max(t < fi && s.lift !== "parked" ? 1 - t / fi : 0,
                                   s.d - t < fi && s.lift !== "ride" ? 1 - (s.d - t) / fi : 0);
  fadeEl.style.opacity = s === SHOTS[0] && t < 1.2 ? Math.max(fade, 1 - t / 1.2) : fade;
  const c = s.caps.find(c => t >= c[0] && t <= c[1]);
  if (c) {
    capMain.textContent = c[2]; capSub.textContent = c[3];
    const a = Math.min(1, (t - c[0]) / 0.5, (c[1] - t) / 0.5);
    capEl.style.opacity = a;
  } else capEl.style.opacity = 0;
  renderer.render(scene, camera);
}
window.renderAt = renderAt;
// still frame from any camera, for checking the model (used by tools, not the UI)
window.previewView = (pos, tgt, hour = 10.5, lights = false, lvl = "all") => {
  setLevel(lvl); lastShot = null; liftCar.visible = false; liftDoors.forEach(m => m.visible = true);
  capEl.style.opacity = 0; fadeEl.style.opacity = 0;
  document.getElementById("time").value = hour; document.getElementById("lights").checked = lights; applyLight();
  camera.position.set(...pos); camera.lookAt(...tgt); renderer.render(scene, camera);
};
window.TOUR_LEN = TOUR_LEN;

let touring = null;
function startTour() {
  document.body.classList.add("touring"); document.getElementById("stop-tour").hidden = false;
  touring = { t0: performance.now() };
}
function stopTour() {
  touring = null; document.body.classList.remove("touring"); document.getElementById("stop-tour").hidden = true;
  capEl.style.opacity = 0; fadeEl.style.opacity = 0; lastShot = null;
  liftCar.visible = false; liftDoors.forEach(m => m.visible = true);
  document.getElementById("time").value = 10.5; applyLight();
}
document.getElementById("play-tour").addEventListener("click", startTour);
document.getElementById("stop-tour").addEventListener("click", stopTour);
addEventListener("keydown", e => { if (e.key === "Escape" && touring) stopTour(); });

const recording = location.hash === "#record";
if (recording) document.body.classList.add("touring");
texReady.then(() => { window.tourReady = true; });

const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
renderer.setAnimationLoop(now => {
  if (recording) return;                       // frames are rendered on demand by renderAt()
  if (touring) {
    const T = (now - touring.t0) / 1000;
    if (T >= TOUR_LEN) stopTour(); else { renderAt(T); return; }
  }
  if (anim) {
    const k = reduce ? 1 : Math.min(1, (now - anim.t0) / 900), e = ease(k);
    camera.position.lerpVectors(anim.p0, anim.p1, e);
    controls.target.lerpVectors(anim.q0, anim.q1, e);
    if (k >= 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
